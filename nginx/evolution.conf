server {
    server_name vmi3402471.contaboserver.net;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Evolution usa websockets para el estado de la conexion
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # La vinculacion por QR y el envio pueden tardar
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50M;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vmi3402471.contaboserver.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vmi3402471.contaboserver.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


    # Servicio de documentos (OCR y conversion) para el copiloto.
    # client_max_body_size alto: una foto de cuaderno o un PDF escaneado pesan.
    location /docs/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_max_body_size 60m;
    }

}
server {
    if ($host = vmi3402471.contaboserver.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name vmi3402471.contaboserver.net;
    return 404; # managed by Certbot


}
